name: Moxfield API Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Moxfield API
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          echo "Teste Moxfield API..."

          URL="https://api2.moxfield.com/v3/decks/all/HtZJddJBNEKyWj3_I8Vb5g"

          HTTP_CODE=$(curl \
            -s \
            -o response.json \
            -w "%{http_code}" \
            -H "User-Agent: $MOXFIELD_USER_AGENT" \
            -H "Accept: application/json" \
            "$URL")

          echo "HTTP Status: $HTTP_CODE"
          echo "Antwort:"
          head -c 1000 response.json
          echo

          if [ "$HTTP_CODE" = "200" ]; then
            echo "================================"
            echo "ERFOLG! Moxfield API funktioniert!"
            echo "================================"
          else
            echo "Moxfield hat den Zugriff abgelehnt."
            exit 1
          fi
