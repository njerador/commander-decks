name: Moxfield Secret Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test
        run: |
          echo "================================"
          echo "NEUER WORKFLOW"
          echo "================================"

      - name: Check Moxfield Secret
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          if [ -z "$MOXFIELD_USER_AGENT" ]; then
            echo "FEHLER: Secret wurde nicht gefunden!"
            exit 1
          fi

          echo "SUCCESS: Moxfield User-Agent wurde geladen."
          echo "Anzahl Zeichen: ${#MOXFIELD_USER_AGENT}"
