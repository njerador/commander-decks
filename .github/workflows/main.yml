name: Test Moxfield Access

on:
  workflow_dispatch:

jobs:
  test-moxfield:
    runs-on: ubuntu-latest

    steps:
      - name: TEST
        run: |
          echo "================================"
          echo "NEUER WORKFLOW WIRD AUSGEFÜHRT"
          echo "================================"

      - name: Check secret
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          if [ -z "$MOXFIELD_USER_AGENT" ]; then
            echo "SECRET FEHLT!"
            exit 1
          fi

          echo "SECRET IST VORHANDEN"
          echo "Anzahl Zeichen: ${#MOXFIELD_USER_AGENT}"
