name: Sync Moxfield Decks

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create decks directory
        run: |
          mkdir -p decks

      - name: Download Deck 01
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          curl -s \
            -H "User-Agent: $MOXFIELD_USER_AGENT" \
            -H "Accept: application/json" \
            "https://api2.moxfield.com/v3/decks/all/V06ztO0Imk-p5I8N81Ue8g" \
            -o decks/deck-01.json

      - name: Wait
        run: sleep 2

      - name: Download Deck 02
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          curl -s \
            -H "User-Agent: $MOXFIELD_USER_AGENT" \
            -H "Accept: application/json" \
            "https://api2.moxfield.com/v3/decks/all/EaLs95TxjUqWITO_S_EvQg" \
            -o decks/deck-02.json

      - name: Wait
        run: sleep 2

      - name: Download Deck 03
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          curl -s \
            -H "User-Agent: $MOXFIELD_USER_AGENT" \
            -H "Accept: application/json" \
            "https://api2.moxfield.com/v3/decks/all/HhNRfRwTEEW8KYS1tRJZWQ" \
            -o decks/deck-03.json

      - name: Wait
        run: sleep 2

      - name: Download Deck 04
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          curl -s \
            -H "User-Agent: $MOXFIELD_USER_AGENT" \
            -H "Accept: application/json" \
            "https://api2.moxfield.com/v3/decks/all/HtZJddJBNEKyWj3_I8Vb5g" \
            -o decks/deck-04.json

      - name: Wait
        run: sleep 2

      - name: Download Deck 05
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          curl -s \
            -H "User-Agent: $MOXFIELD_USER_AGENT" \
            -H "Accept: application/json" \
            "https://api2.moxfield.com/v3/decks/all/Pfcxa6ZPG0aymFgL4EnykQ" \
            -o decks/deck-05.json

      - name: Wait
        run: sleep 2

      - name: Download Deck 06
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          curl -s \
            -H "User-Agent: $MOXFIELD_USER_AGENT" \
            -H "Accept: application/json" \
            "https://api2.moxfield.com/v3/decks/all/c5LA9QE_8kW8-uH2_K3Gfg" \
            -o decks/deck-06.json

      - name: Wait
        run: sleep 2

      - name: Download Deck 07
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          curl -s \
            -H "User-Agent: $MOXFIELD_USER_AGENT" \
            -H "Accept: application/json" \
            "https://api2.moxfield.com/v3/decks/all/p8SZwpoQ50iqg0lC246gQg" \
            -o decks/deck-07.json

      - name: Wait
        run: sleep 2

      - name: Download Deck 08
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          curl -s \
            -H "User-Agent: $MOXFIELD_USER_AGENT" \
            -H "Accept: application/json" \
            "https://api2.moxfield.com/v3/decks/all/OjdBIK_rg0qV-qA0eFtvXw" \
            -o decks/deck-08.json

      - name: Wait
        run: sleep 2

      - name: Download Deck 09
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          curl -s \
            -H "User-Agent: $MOXFIELD_USER_AGENT" \
            -H "Accept: application/json" \
            "https://api2.moxfield.com/v3/decks/all/F4yQH82KJEGJ95nwUIo6_A" \
            -o decks/deck-09.json

      - name: Wait
        run: sleep 2

      - name: Download Deck 10
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          curl -s \
            -H "User-Agent: $MOXFIELD_USER_AGENT" \
            -H "Accept: application/json" \
            "https://api2.moxfield.com/v3/decks/all/dNTuEnmK80ChNB9XIPe3Lw" \
            -o decks/deck-10.json

      - name: Check downloaded files
        run: |
          echo "Heruntergeladene Decks:"
          ls -lh decks/
          
      - name: Create deck overview
        run: |
          python3 scripts/create-overview.py

      - name: Create card index
        run: |
          python3 scripts/create-card-index.py
          
      - name: Commit updated decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add decks/

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Update Moxfield decks"
            git push
          fi
