name: Sync Moxfield Decks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create decks directory
        run: mkdir -p decks

      - name: Download all decks
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          set -e

          DECK_IDS=(
            "V06ztO0Imk-p5I8N81Ue8g"
            "EaLs95TxjUqWITO_S_EvQg"
            "HhNRfRwTEEW8KYS1tRJZWQ"
            "HtZJddJBNEKyWj3_I8Vb5g"
            "Pfcxa6ZPG0aymFgL4EnykQ"
            "c5LA9QE_8kW8-uH2_K3Gfg"
            "p8SZwpoQ50iqg0lC246gQg"
            "OjdBIK_rg0qV-qA0eFtvXw"
            "F4yQH82KJEGJ95nwUIo6_A"
            "dNTuEnmK80ChNB9XIPe3Lw"
          )

          for i in "${!DECK_IDS[@]}"; do
            DECK_NUMBER=$((i + 1))
            DECK_ID="${DECK_IDS[$i]}"

            echo "================================"
            echo "Download Deck $DECK_NUMBER"
            echo "Moxfield ID: $DECK_ID"
            echo "================================"

            curl -f -s \
              -H "User-Agent: $MOXFIELD_USER_AGENT" \
              -H "Accept: application/json" \
              "https://api2.moxfield.com/v3/decks/all/$DECK_ID" \
              -o "decks/deck-$(printf '%02d' "$DECK_NUMBER").json"

            sleep 2
          done

      - name: Check downloaded files
        run: |
          echo "Heruntergeladene Decks:"
          ls -lh decks/

      - name: Create deck overview
        run: |
          python3 scripts/create-overview.py

      - name: Create card index
        run: |
          python3 scripts/create-card-index.py

      - name: Commit updated decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add decks/

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Update Moxfield decks"
            git push
          fi
