name: Sync Moxfield Decks

on:
  workflow_dispatch:

  push:
    paths:
      - "config/decks.json"

  schedule:
    - cron: "*/30 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create decks directory
        run: mkdir -p decks

      - name: Download all decks
        env:
          MOXFIELD_USER_AGENT: ${{ secrets.MOXFIELD_USER_AGENT }}
        run: |
          set -e

          python3 - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          config_path = Path("config/decks.json")
          decks_dir = Path("decks")

          with open(config_path, "r", encoding="utf-8") as f:
              config = json.load(f)

          deck_ids = config["decks"]

          print(f"{len(deck_ids)} Decks in der Config gefunden.")

          for i, deck_id in enumerate(deck_ids, start=1):
              output = decks_dir / f"deck-{i:02d}.json"

              print()
              print("================================")
              print(f"Download Deck {i}")
              print(f"Moxfield ID: {deck_id}")
              print("================================")

              subprocess.run([
                  "curl",
                  "-f",
                  "-s",
                  "-H", f"User-Agent: {__import__('os').environ['MOXFIELD_USER_AGENT']}",
                  "-H", "Accept: application/json",
                  f"https://api2.moxfield.com/v3/decks/all/{deck_id}",
                  "-o", str(output)
              ], check=True)

              time.sleep(2)
          PY

      - name: Check downloaded files
        run: |
          echo "Heruntergeladene Decks:"
          ls -lh decks/

      - name: Create deck overview
        run: |
          python3 scripts/create-overview.py

      - name: Create card index
        run: |
          python3 scripts/create-card-index.py

      - name: Create analysis export
        run: |
          python3 scripts/export-for-analysis.py

      - name: Create deck change log
        run: |
          python3 scripts/create-change-log.py

      - name: Commit updated decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"

          git add decks/

          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Update Moxfield decks"
            git push
          fi
